name: '[FSB] TF - Standalone'

env:
  TFPath: FortiSandbox/Standalone/terraform/
  ZIPfile: FortiSandbox_Standalone_Terraform.zip

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FortiSandbox/Standalone/terraform/*.tf'
      - 'FortiSandbox/Standalone/terraform/*.tpl'
      - 'FortiSandbox/Standalone/terraform/*.hcl'
      - 'FortiSandbox/Standalone/terraform/*.json'
      - 'FortiSandbox/Standalone/terraform/*.yaml'

jobs:
  OCI-FSB-TF-Standalone:
    name: 'Terraform FortiSandbox Standalone'
    runs-on: ubuntu-latest
    env:
      TF_VAR_tenancy_ocid: "${{ secrets.TENANCY_OCID }}"
      TF_VAR_compartment_ocid: "${{ secrets.COMPARTMENT_OCID }}"
      TF_VAR_user_ocid: "${{ secrets.USER_OCID }}"
      TF_VAR_region: "${{ secrets.REGION }}"
      TF_VAR_fingerprint: "${{ secrets.FINGERPRINT }}"
      TF_VAR_private_key_path: ~/.oci/oci_api_key.pem
      TF_VAR_vcn_id: "${{ secrets.VCN_OCID }}"
      TF_VAR_vcn_cidr: "${{ secrets.VCN_CIDR }}"
      TF_VAR_availability_domain_name: "${{ secrets.AVAILABILITY_DOMAIN_NAME_1 }}"
      TF_VAR_fault_domain_name: "${{ secrets.FAULT_DOMAIN_NAME_1 }}"
      TF_VAR_fortisandbox_version: "${{ secrets.FORTISANDBOX_VERSION }}"
      TF_VAR_license_type: "${{ secrets.LICENSE_TYPE }}"
      TF_VAR_vm_compute_shape: "${{ secrets.FORTISANDBOX_COMPUTE_SHAPE }}"

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3

    - name: Configure OCI credentials
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_PEM_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: "Terraform Init"
      id: init
      run: terraform init
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Validation"
      id: validate
      run: terraform validate
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Format"
      id: format
      run: terraform fmt -check -diff
      working-directory: ${{ env.TFPath }}

    - name: "Show Terraform Selection Inputs"
      run: |
        echo "FORTISANDBOX_VERSION=${TF_VAR_fortisandbox_version}"
        echo "LICENSE_TYPE=${TF_VAR_license_type}"
        echo "VM_COMPUTE_SHAPE=${TF_VAR_vm_compute_shape}"
        echo "VCN_ID=${TF_VAR_vcn_id}"
        echo "VCN_CIDR=${TF_VAR_vcn_cidr}"
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Plan"
      id: plan
      run: terraform plan -input=false -out=plan.tfplan
      working-directory: ${{ env.TFPath }}
      timeout-minutes: 15

    - name: "Terraform Show"
      id: show
      run: terraform show -json plan.tfplan
      working-directory: ${{ env.TFPath }}

    - name: "Save Plan JSON"
      run: terraform show -json plan.tfplan > plan.json
      working-directory: ${{ env.TFPath }}

    - name: Package and convert templates
      uses: azure/powershell@v1
      with:
        inlineScript: |
          Compress-Archive -Path "./FortiSandbox/Standalone/terraform/*" -DestinationPath "./${{ env.ZIPfile }}"
        azPSVersion: "latest"

    - name: upload-templates-zip
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{secrets.GITHUB_TOKEN}}
        file: ./${{ env.ZIPfile }}
        asset_name: ${{ env.ZIPfile }}
        tag: fsbstandalone
        overwrite: true
        body: "OCI FortiSandbox Standalone"
