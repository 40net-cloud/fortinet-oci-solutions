# Title shown in Application Information tab.
title: FortiWeb Standalone Deployment Template
# Sub Title shown in Application Information tab.
description: This template deploys a single FortiWeb instance in OCI with a management subnet and a trust subnet.
schemaVersion: 1.1.0
version: "20260815"

locale: "en"

variableGroups:
  - title: "Hidden Variable Group"
    visible: false
    variables:
      - tenancy_ocid
      - user_ocid
      - fingerprint
      - private_key_path
      - region
      - mp_subscription_enabled

  - title: "FortiWeb Compute Configuration"
    variables:
      - compartment_ocid
      - vm_display_name
      - availability_domain_name_1
      - fault_domain_name_1
      - license_type
      - fortiweb_version
      - cpu_type
      - vm_compute_shape_x64
      - ocpu_count
      - memory_in_gbs
      - boot_volume_size_in_gbs
      - data_volume_size_in_gbs
      - instance_launch_options_network_type

  - title: "FortiWeb Network Configuration"
    variables:
      - network_strategy
      - vcn_id
      - vcn_display_name
      - vcn_cidr_block
      - vcn_dns_label
      - management_subnet_id
      - management_subnet_display_name
      - management_subnet_cidr_block
      - management_subnet_dns_label
      - trust_subnet_id
      - trust_subnet_display_name
      - trust_subnet_cidr_block
      - trust_subnet_dns_label
      - management_routetable_display_name
      - trust_routetable_display_name
      - management_routetable_display_name_existing
      - trust_routetable_display_name_existing

  - title: "FortiWeb IP Configuration"
    variables:
      - mgmt_private_ip
      - trust_private_ip
      - mgmt_subnet_gateway
      - trust_subnet_gateway
      - volume_size

variables:
  tenancy_ocid:
    type: string
    title: Tenancy ID
    description: The Oracle Cloud Identifier (OCID) for your tenancy
    required: true

  user_ocid:
    type: string
    title: User OCID
    description: OCI user OCID used for API authentication
    required: true

  fingerprint:
    type: string
    title: API Key Fingerprint
    description: Fingerprint for the OCI API key
    required: true

  private_key_path:
    type: string
    title: Private Key Path
    description: Local path to the OCI API private key
    required: true

  region:
    type: oci:identity:region:name
    title: Region
    description: The OCI region in which to create all resources
    required: true

  mp_subscription_enabled:
    type: boolean
    title: Subscribe to the FortiWeb Marketplace Listing
    description: Enables the Oracle Cloud Marketplace subscription for the FortiWeb image
    required: true
    default: true

  compartment_ocid:
    type: oci:identity:compartment:id
    title: Compartment OCID
    description: Compartment for compute, network, and Marketplace resources
    required: true

  vm_display_name:
    type: string
    title: FortiWeb Instance Name
    description: Display name for the FortiWeb instance
    required: true
    default: FortiWeb-Standalone

  availability_domain_name_1:
    type: oci:identity:availabilitydomain:name
    title: Availability Domain
    description: Availability domain for the FortiWeb instance
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  fault_domain_name_1:
    type: oci:identity:faultdomain:name
    title: Fault Domain
    description: Fault domain for the FortiWeb instance
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      availabilityDomainName: ${availability_domain_name_1}

  license_type:
    type: enum
    title: FortiWeb License Type
    description: FortiWeb Marketplace license type
    required: true
    default: BYOL
    enum:
      - BYOL

  fortiweb_version:
    type: enum
    title: FortiWeb Version
    description: FortiWeb image version. Keep this list synchronized with final_listings.json.
    required: true
    default: "8.0.3"
    enum:
      - "8.0.3"
      - "7.6.6"

  cpu_type:
    type: enum
    title: CPU Architecture
    description: CPU architecture for the selected FortiWeb image
    required: true
    default: X64
    enum:
      - X64

  vm_compute_shape_x64:
    type: enum
    title: FortiWeb Compute Shape
    description: OCI compute shape to use for the FortiWeb instance
    required: true
    default: VM.Standard2.2
    enum:
      - VM.Standard2.1
      - VM.Standard2.2
      - VM.Standard2.4
      - VM.Standard2.8
      - VM.Standard2.16
      - VM.Standard2.24
      - VM.Standard3.Flex
      - VM.Standard.E4.Flex
      - VM.Standard.E5.Flex
      - VM.Standard.E6.Flex

  ocpu_count:
    type: enum
    title: OCPUs
    description: Number of OCPUs for Flex VM shapes
    required: true
    default: 4
    enum:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 24
    visible:
      or:
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard3.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E4.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E5.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E6.Flex

  memory_in_gbs:
    type: enum
    title: Memory (GB)
    description: Memory for Flex VM shapes
    required: true
    default: 16
    enum:
      - 16
      - 32
      - 64
      - 128
      - 256
      - 384
    visible:
      or:
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard3.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E4.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E5.Flex
        - eq:
            - ${vm_compute_shape_x64}
            - VM.Standard.E6.Flex

  boot_volume_size_in_gbs:
    type: integer
    title: Boot Volume Size (GB)
    description: Boot volume size for the FortiWeb instance
    required: true
    default: 50
    minimum: 50

  data_volume_size_in_gbs:
    type: integer
    title: Data Volume Size (GB)
    description: Data volume size for the FortiWeb instance
    required: true
    default: 50
    minimum: 50

  instance_launch_options_network_type:
    type: enum
    title: VNIC Network Type
    description: Instance NIC attachment type
    required: true
    default: PARAVIRTUALIZED
    enum:
      - PARAVIRTUALIZED
      - VFIO

  network_strategy:
    type: enum
    title: Network Strategy
    description: Whether to create a new VCN or reuse an existing one
    required: true
    default: Create New VCN and Subnets
    enum:
      - Create New VCN and Subnets
      - Use Existing VCN and Subnets

  vcn_id:
    visible:
      eq:
        - ${network_strategy}
        - Use Existing VCN and Subnets
    type: oci:core:vcn:id
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true
    title: Select Existing VCN
    description: Existing Virtual Cloud Network to use for the FortiWeb deployment.

  vcn_display_name:
    visible:
      eq:
        - ${network_strategy}
        - Create New VCN and Subnets
    type: string
    title: VCN Name
    description: Name of the new VCN to create
    required: true
    default: FortiWeb-Hub-VCN

  vcn_cidr_block:
    type: string
    title: VCN CIDR Block
    description: CIDR block of the new VCN
    required: true
    default: 10.0.0.0/16

  vcn_dns_label:
    type: string
    title: VCN DNS Label
    description: DNS label of the new VCN
    required: true
    default: fwbvcn

  management_subnet_id:
    visible:
      eq:
        - ${network_strategy}
        - Use Existing VCN and Subnets
    type: oci:core:subnet:id
    dependsOn:
      vcnId: ${vcn_id}
      compartmentId: ${compartment_ocid}
    required: true
    title: Select Existing Management Subnet
    description: Existing management subnet to use for the FortiWeb management interface.

  management_subnet_display_name:
    visible:
      eq:
        - ${network_strategy}
        - Create New VCN and Subnets
    type: string
    title: Management Subnet Name
    description: Name of the management subnet
    required: true
    default: management-subnet

  management_subnet_cidr_block:
    type: string
    title: Management Subnet CIDR
    description: CIDR for the management subnet
    required: true
    default: 10.0.1.0/24

  management_subnet_dns_label:
    type: string
    title: Management Subnet DNS Label
    description: DNS label for the management subnet
    required: true
    default: mgmt

  trust_subnet_id:
    visible:
      eq:
        - ${network_strategy}
        - Use Existing VCN and Subnets
    type: oci:core:subnet:id
    dependsOn:
      vcnId: ${vcn_id}
      compartmentId: ${compartment_ocid}
    required: true
    title: Select Existing Trust Subnet
    description: Existing trust subnet to use for the FortiWeb trust interface.

  trust_subnet_display_name:
    visible:
      eq:
        - ${network_strategy}
        - Create New VCN and Subnets
    type: string
    title: Trust Subnet Name
    description: Name of the trust subnet
    required: true
    default: trust-subnet

  trust_subnet_cidr_block:
    type: string
    title: Trust Subnet CIDR
    description: CIDR for the trust subnet
    required: true
    default: 10.0.2.0/24

  trust_subnet_dns_label:
    type: string
    title: Trust Subnet DNS Label
    description: DNS label for the trust subnet
    required: true
    default: trust

  management_routetable_display_name:
    type: string
    title: Management Route Table Name
    description: Display name for the management route table
    required: true
    default: Management-Route-Table

  trust_routetable_display_name:
    type: string
    title: Trust Route Table Name
    description: Display name for the trust route table
    required: true
    default: Trust-Route-Table

  management_routetable_display_name_existing:
    type: string
    title: Existing Management Route Table Name
    description: Existing route table name for the management subnet when reusing a VCN
    required: false
    default: Management-Route-Table-Existing

  trust_routetable_display_name_existing:
    type: string
    title: Existing Trust Route Table Name
    description: Existing route table name for the trust subnet when reusing a VCN
    required: false
    default: Trust-Route-Table-Existing

  mgmt_private_ip:
    type: string
    title: Management Private IP
    description: Private IP assigned to the FortiWeb management interface
    required: true
    default: 10.0.1.10

  trust_private_ip:
    type: string
    title: Trust Private IP
    description: Private IP assigned to the FortiWeb trust interface
    required: true
    default: 10.0.2.10

  mgmt_subnet_gateway:
    type: string
    title: Management Subnet Gateway
    description: Gateway for the management subnet
    required: true
    default: 10.0.1.1

  trust_subnet_gateway:
    type: string
    title: Trust Subnet Gateway
    description: Gateway for the trust subnet
    required: true
    default: 10.0.2.1

  volume_size:
    type: integer
    title: Data Volume Size (GB)
    description: Additional storage volume size for the FortiWeb instance
    required: true
    default: 50
    minimum: 50
