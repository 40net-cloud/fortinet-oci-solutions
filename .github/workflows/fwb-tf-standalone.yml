name: '[FWB] TF - Standalone'

env:
  TFPath: FortiWeb/Standalone/terraform/
  ZIPfile: FortiWeb_Standalone_Terraform.zip

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FortiWeb/Standalone/terraform/*.tf'
      - 'FortiWeb/Standalone/terraform/*.tpl'
      - 'FortiWeb/Standalone/terraform/*.hcl'
      - 'FortiWeb/Standalone/terraform/*.json'
      - 'FortiWeb/Standalone/terraform/*.yaml'

jobs:
  OCI-FWB-TF-Standalone:
    name: 'Terraform FortiWeb Standalone'
    runs-on: ubuntu-latest
    env:
      TF_VAR_tenancy_ocid: "${{ secrets.TENANCY_OCID }}"
      TF_VAR_compartment_ocid: "${{ secrets.COMPARTMENT_OCID }}"
      TF_VAR_user_ocid: "${{ secrets.USER_OCID }}"
      TF_VAR_region: "${{ secrets.REGION }}"
      TF_VAR_fingerprint: "${{ secrets.FINGERPRINT }}"
      TF_VAR_private_key_path: ~/.oci/oci_api_key.pem
      TF_VAR_vcn_id: "${{ secrets.VCN_OCID }}"
      TF_VAR_vcn_cidr_block: "${{ secrets.VCN_CIDR }}"
      TF_VAR_availability_domain_name_1: "${{ secrets.AVAILABILITY_DOMAIN_NAME_1 }}"
      TF_VAR_fault_domain_name_1: "${{ secrets.FAULT_DOMAIN_NAME_1 }}"
      TF_VAR_cpu_type: "${{ secrets.CPU_TYPE }}"
      TF_VAR_fortiweb_version: "${{ secrets.FORTIWEB_VERSION }}"
      TF_VAR_license_type: "${{ secrets.LICENSE_TYPE }}"
      TF_VAR_vm_compute_shape_x64: "${{ secrets.FORTIWEB_COMPUTE_SHAPE }}"
      
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3

    - name: Configure OCI credentials
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_PEM_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: "Terraform Init"
      id: init
      run: terraform init
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Validation"
      id: validate
      run: terraform validate
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Format"
      id: format
      run: terraform fmt -check -diff
      working-directory: ${{ env.TFPath }}

    - name: "Show Terraform Selection Inputs"
      run: |
        echo "CPU_TYPE=${TF_VAR_cpu_type}"
        echo "FORTIWEB_VERSION=${TF_VAR_fortiweb_version}"
        echo "LICENSE_TYPE=${TF_VAR_license_type}"
        echo "VM_COMPUTE_SHAPE_X64=${TF_VAR_vm_compute_shape_x64}"
        echo "VCN_ID=${TF_VAR_vcn_id}"
        echo "VCN_CIDR_BLOCK=${TF_VAR_vcn_cidr_block}"
      working-directory: ${{ env.TFPath }}

    - name: "Terraform Plan"
      id: plan
      run: terraform plan -input=false -out=plan.tfplan
      working-directory: ${{ env.TFPath }}
      timeout-minutes: 15

    - name: "Terraform Show"
      id: show
      run: terraform show -json plan.tfplan
      working-directory: ${{ env.TFPath }}

    - name: "Save Plan JSON"
      run: echo '${{ steps.show.outputs.stdout }}' > plan.json # Do not change

    - name: Package and convert templates
      uses: azure/powershell@v1
      with:
        inlineScript: |
          Compress-Archive -Path "./FortiWeb/Standalone/terraform/*" -DestinationPath "./${{ env.ZIPfile }}"
        azPSVersion: "latest"

    - name: upload-templates-zip
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{secrets.GITHUB_TOKEN}}
        file: ./${{ env.ZIPfile }}
        asset_name: ${{ env.ZIPfile }}
        tag: fwbstandalone
        overwrite: true
        body: "OCI FortiWeb Standalone"
