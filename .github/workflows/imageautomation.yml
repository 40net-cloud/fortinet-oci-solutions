name: Generate Final Listings JSON

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      force_trigger_test:
        description: 'Force a JSON-only test update and trigger downstream workflows'
        required: false
        default: false
        type: boolean

jobs:
  generate-json:
    runs-on: ubuntu-latest
    env:
      TFPath: FortiAnalyzer/terraform/

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.AUTOMATION_PAT }}
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install OCI SDK
      run: pip install oci

    - name: Configure OCI credentials
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_PEM_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: Run Python script to generate JSON
      env:
        USER_OCID: ${{ secrets.USER_OCID }}
        FINGERPRINT: ${{ secrets.FINGERPRINT }}
        TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
        REGION: ${{ secrets.REGION }}
        OCI_KEY_FILE: ~/.oci/oci_api_key.pem
      run: |
        ls -l ~/.oci/oci_api_key.pem
        python .github/workflows/scripts/ocimarketplace.py

    - name: Copy final_listings.json to all product folders
      run: |
        # Copy generated JSON file to each folder
        cp final_listings.json FortiAnalyzer/terraform/
        cp final_listings.json FortiManager/terraform/
        cp final_listings.json FortiGate/Standalone/terraform/
        cp final_listings.json FortiGate/Active-Passive/terraform/
        cp final_listings.json FortiWeb/Standalone/terraform/

    - name: Commit and push updated JSON files
      id: commit
      run: |
        git config user.name "fortinet-automation"
        git config user.email "fortinet-automation@users.noreply.github.com"

        git add FortiAnalyzer/terraform/final_listings.json
        git add FortiManager/terraform/final_listings.json
        git add FortiGate/Standalone/terraform/final_listings.json
        git add FortiGate/Active-Passive/terraform/final_listings.json
        git add FortiWeb/Standalone/terraform/final_listings.json
        if git diff --cached --quiet; then
          echo "No listing changes to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "chore: update final listings"
        git push origin HEAD:main
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Force downstream workflow dispatch
      if: ${{ inputs.force_trigger_test && steps.commit.outputs.changed == 'false' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run faz-tf-standalone.yml --ref main
        gh workflow run fmg-tf-standalone.yml --ref main
        gh workflow run fgt-tf-standalone.yml --ref main
        gh workflow run fgt-tf-activepassive.yml --ref main
        gh workflow run fwb-tf-standalone.yml --ref main
